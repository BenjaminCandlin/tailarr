# Builds the Docker image and publishes it to the GitHub Container Registry:
# - every merge into main: tag `edge` (for trying changes before a release);
# - every release tag like v1.0.0: tags `latest`, `1.0.0` and `1.0`, so people on
#   `latest` only get released versions, and a version can be pinned.
# Pre-releases (v1.1.0-beta.1) get their own version tag but never `latest`.
#
# The package must be public (GitHub > your profile > Packages > tailarr >
# Package settings > Change visibility) so Unraid can download it without logging in.
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/benjamincandlin/tailarr

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tailarr:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image works before publishing
        run: docker/smoke-test.sh tailarr:candidate

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
