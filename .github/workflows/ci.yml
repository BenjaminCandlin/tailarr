# Runs every test on each pull request (and on main).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Keep in step with DOVI_TOOL_VERSION in the Dockerfile.
  DOVI_TOOL_VERSION: "2.3.4"
  # Keep both the same as in the Dockerfile.
  DOVI_TOOL_SHA256: "1844258e13c26607b32224bf1fa82b595d3b35949f5467405fda560daad32b3f"

jobs:
  tests:
    name: Backend, frontend and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install MKVToolNix, MediaInfo and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mkvtoolnix mediainfo ffmpeg

      - name: Install dovi_tool
        run: |
          curl -fsSL -o /tmp/dovi_tool.tar.gz "https://github.com/quietvoid/dovi_tool/releases/download/${DOVI_TOOL_VERSION}/dovi_tool-${DOVI_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${DOVI_TOOL_SHA256}  /tmp/dovi_tool.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/dovi_tool.tar.gz -C /usr/local/bin
          dovi_tool --version

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend - lint
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .

      - name: Backend - tests
        working-directory: backend
        env:
          TAILARR_REQUIRE_ALL_TOOLS: "1"
        run: uv run pytest -v

      - name: Frontend - lint, tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Browser tests (desktop and phone)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tailarr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker/smoke-test.sh tailarr:test
